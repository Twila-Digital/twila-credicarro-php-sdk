name: Contract tests

on:
  schedule:
    - cron: '31 6 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:2.10.3
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpunit -c contract-tests/phpunit.xml
